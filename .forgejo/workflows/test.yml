name: Fork Tests

on:
  push:
    branches:
      - main
      - feat/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint, type-check and run unit/browser tests
        run: docker build --file Dockerfile.ci --tag foxess-control-ci:test .
