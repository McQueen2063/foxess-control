name: Fork Tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Docker-backed Buildx builder
        run: |
          docker buildx version
          info="$(docker buildx inspect default)"
          printf '%s\n' "$info"
          printf '%s\n' "$info" | grep -Eq '^Driver:[[:space:]]+docker[[:space:]]*$'
      - name: Lint, type-check and run unit/browser tests
        run: docker buildx build --builder default --load --progress=plain --file Dockerfile.ci --tag foxess-control-ci:test .

  ha-status-smoke:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check Docker-backed Buildx builder
        run: |
          docker buildx version
          info="$(docker buildx inspect default)"
          printf '%s\n' "$info"
          printf '%s\n' "$info" | grep -Eq '^Driver:[[:space:]]+docker[[:space:]]*$'
      - name: Build validated test environment
        run: docker buildx build --builder default --load --progress=plain --file Dockerfile.ci --tag foxess-control-ci:test .
      - name: Build isolated nested-Podman environment
        run: docker buildx build --builder default --load --progress=plain --file Dockerfile.e2e-ci --tag foxess-control-e2e:test .
      - name: HA status and control-lifecycle regression tests
        # No host socket, host network, secrets or production config mounts.
        # Full test_e2e.py module: cloud and entity modes, two workers maximum.
        # Multi-hour soak scenarios and the UI suite are not included here.
        run: >-
          docker run --rm --privileged --shm-size=512m foxess-control-e2e:test
          pytest tests/e2e/test_mode_status.py tests/e2e/test_e2e.py
          -m slow -n 2 -p no:randomly --tb=long -v --durations=15
